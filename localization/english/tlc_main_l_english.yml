 # ═══════════════════════════════════════════════════════════════
 # EVENTS — WORKFORCE
 # ═══════════════════════════════════════════════════════════════
 
 tlc_workforce.1.t:0 "The Industrial Workforce"
 tlc_workforce.1.d:0 "Urbanization and the growth of factories are transforming the labor market. Workers are leaving the countryside in search of industrial employment. The available workforce is expanding."
 tlc_workforce.1.f:0 "The cities grow ever larger..."
 tlc_workforce.1.a:0 "The age of industry has begun."
 
 tlc_workforce.2.t:0 "The Modern Workforce"
 tlc_workforce.2.d:0 "Education, urbanization, and mechanization have fundamentally changed the nature of work. A larger portion of the population is now economically active."
 tlc_workforce.2.f:0 "A new century dawns..."
 tlc_workforce.2.a:0 "Progress marches on."
 
 tlc_workforce.3.t:0 "The Late Industrial Economy"
 tlc_workforce.3.d:0 "The modern economy demands an ever-larger workforce. Industrialized nations can now sustain larger economic operations without crippling labor shortages."
 tlc_workforce.3.f:0 "The machines never stop..."
 tlc_workforce.3.a:0 "We must keep pace."
 
 # ═══════════════════════════════════════════════════════════════
 # EVENTS — GERMANY
 # ═══════════════════════════════════════════════════════════════
 
 tlc_germany.1.t:0 "Premature Unification"
 tlc_germany.1.d:0 "Germany has been unified before the political and institutional foundations were truly ready. While a remarkable achievement, the administrative challenges of integrating so many diverse states will be enormous. We must expect turbulence."
 tlc_germany.1.f:0 "Was it too soon?"
 tlc_germany.1.a:0 "We shall endure the growing pains."
 
 tlc_germany.2.t:0 "A United Germany"
 tlc_germany.2.d:0 "Germany stands united! The long process of political preparation and diplomatic maneuvering has borne fruit. Our nation is ready for its place among the great powers."
 tlc_germany.2.f:0 "Deutschland über alles!"
 tlc_germany.2.a:0 "The German nation rises!"
 
 tlc_germany.10.a:0 "Recovery proceeds."
 
 tlc_germany.11.t:0 "Integration Complete"
 tlc_germany.11.d:0 "The challenges of unification have finally been overcome. Germany now functions as a cohesive national entity."
 tlc_germany.11.a:0 "A new era begins."
 
 # ═══════════════════════════════════════════════════════════════
 # EVENTS — ECONOMY
 # ═══════════════════════════════════════════════════════════════
 
 tlc_economy.1.t:0 "Growing Scientific Complexity"
 tlc_economy.1.d:0 "As our understanding of the world deepens, new discoveries require increasingly specialized knowledge and equipment. Research will take longer."
 tlc_economy.1.f:0 "The low-hanging fruit has been picked."
 tlc_economy.1.a:0 "We must invest more in research."
 
 tlc_economy.2.t:0 "The Scientific Frontier Expands"
 tlc_economy.2.d:0 "The boundaries of human knowledge continue to advance, but each step forward demands greater effort. New breakthroughs require dedicated institutions and trained specialists."
 tlc_economy.2.f:0 "Knowledge without limit, but resources with limit."
 tlc_economy.2.a:0 "The pursuit of knowledge continues."
 
 tlc_economy.3.t:0 "The Age of Specialization"
 tlc_economy.3.d:0 "Modern science has become highly specialized. Research projects require teams of experts, expensive equipment, and years of dedicated work."
 tlc_economy.3.f:0 "Gone are the days of lone geniuses."
 tlc_economy.3.a:0 "We adapt to the new reality."
 
 tlc_economy.4.t:0 "Cutting-Edge Research"
 tlc_economy.4.d:0 "We stand at the very frontier of human knowledge. Each new discovery demands enormous resources and the most brilliant minds of a generation."
 tlc_economy.4.f:0 "The edge of what is possible."
 tlc_economy.4.a:0 "We push forward regardless."
 
 # ═══════════════════════════════════════════════════════════════
 # EVENTS — LGBT
 # ═══════════════════════════════════════════════════════════════
 
 tlc_lgbt.1.t:0 "LGBT Rights Movement"
 tlc_lgbt.1.d:0 "A movement for the rights of homosexuals and gender minorities has emerged in our cities. Intellectuals and progressive politicians are debating whether the law should change."
 tlc_lgbt.1.f:0 "A question of rights..."
 tlc_lgbt.1.a:0 "Support the movement."
 tlc_lgbt.1.b:0 "Maintain the status quo."
 
 tlc_lgbt.2.t:0 "Conservative Backlash"
 tlc_lgbt.2.d:0 "The decriminalization of homosexuality has provoked a furious reaction from religious and conservative circles. They demand that the reforms be reversed."
 tlc_lgbt.2.f:0 "Not everyone welcomes change."
 tlc_lgbt.2.a:0 "We stand by the reform."
 tlc_lgbt.2.b:0 "Make concessions to calm the opposition."
 
