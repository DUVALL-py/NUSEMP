l_english:
 tyrone_disaster.1.t:0 "Devastating Earthquake!"
 tyrone_disaster.1.d:0 "A catastrophic earthquake has struck our nation, leaving widespread destruction in its wake. Buildings have collapsed, roads are impassable, and countless citizens are displaced."
 tyrone_disaster.1.f:0 "The earth itself trembles beneath our feet."
 tyrone_disaster.1.a:0 "Deploy emergency relief immediately!"
 tyrone_disaster.1.b:0 "We cannot afford to intervene."
 tyrone_disaster.2.t:0 "The Great Flood"
 tyrone_disaster.2.d:0 "Unprecedented rainfall has caused rivers to burst their banks, inundating farmland and sweeping away homes. Agricultural output will be severely impacted for years."
 tyrone_disaster.2.f:0 "The waters rise without mercy."
 tyrone_disaster.2.a:0 "Organize flood relief and rescue operations!"
 tyrone_disaster.2.b:0 "Let the waters recede naturally."
 tyrone_disaster.3.t:0 "Severe Drought Grips the Nation"
 tyrone_disaster.3.d:0 "Months without rain have parched the land. Crops wither in the fields, livestock perish, and famine threatens the rural population."
 tyrone_disaster.3.f:0 "The sun blazes mercilessly upon cracked earth."
 tyrone_disaster.3.a:0 "Fund emergency irrigation and food distribution!"
 tyrone_disaster.3.b:0 "Pray for rain."
 tyrone_disaster.4.t:0 "Volcanic Eruption!"
 tyrone_disaster.4.d:0 "A terrifying volcanic eruption has blanketed the region in ash and lava. Entire communities have been evacuated, and the devastation is immense."
 tyrone_disaster.4.f:0 "Fire and ash darken the skies."
 tyrone_disaster.4.a:0 "Evacuate and rebuild at any cost!"
 tyrone_disaster.4.b:0 "The region is lost."
 tyrone_disaster.5.t:0 "National Reconstruction Complete"
 tyrone_disaster.5.d:0 "Through tremendous national effort, the devastated regions have been rebuilt. Our nation emerges from disaster stronger and more resilient than before."
 tyrone_disaster.5.f:0 "From the ashes, a nation reborn."
 tyrone_disaster.5.a:0 "A testament to our people's resilience!"
 modifier_earthquake_devastation:0 "Earthquake Devastation"
 modifier_earthquake_devastation_desc:0 "Widespread structural damage from a catastrophic earthquake hampers construction and infrastructure."
 modifier_great_flood:0 "Great Flood"
 modifier_great_flood_desc:0 "Catastrophic flooding has devastated farmland and displaced populations."
 modifier_severe_drought:0 "Severe Drought"
 modifier_severe_drought_desc:0 "Prolonged drought devastates agriculture and threatens famine."
 modifier_volcanic_eruption:0 "Volcanic Eruption"
 modifier_volcanic_eruption_desc:0 "Volcanic ash and lava flows have destroyed infrastructure and claimed lives."
 modifier_national_reconstruction:0 "National Reconstruction"
 modifier_national_reconstruction_desc:0 "A surge of construction and national pride following the successful recovery from disaster."
 modifier_disaster_relief_fund:0 "Disaster Relief Fund"
 modifier_disaster_relief_fund_desc:0 "Government-funded emergency relief accelerates recovery and reduces mortality."
