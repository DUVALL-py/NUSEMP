l_english:
 national_direction.1.t:0 "The Course of the Nation"
 national_direction.1.d:0 "The government must determine the central priority of the nation for the next ten years. Every path promises progress, but concentrating our resources in one field will inevitably demand sacrifices elsewhere."
 national_direction.1.f:0 "A nation cannot march in every direction at once."
 national_direction.1.a:0 "Knowledge shall light the way â€" Scientific Vanguard"
 national_direction.1.b:0 "The nation must be ready â€" National Mobilization"
 national_direction.1.c:0 "Our heritage shall inspire the world â€" Cultural Renaissance"
 national_direction.1.e:0 "Prosperity is forged in our industries â€" Industrial Prosperity"
 national_direction.1.g:0 "An efficient state is a powerful state â€" Administrative Reform"
 national_direction.1.neutral:0 "We shall maintain the status quo â€" Neutral Path"
 national_direction.2.t:0 "The Current National Direction"
 national_direction.2.science:0 "Our country is pursuing a Scientific Vanguard. Research receives priority, while military procurement and political authority bear the cost. The direction can be reconsidered when the current ten-year plan expires."
 national_direction.2.military:0 "Our country is committed to National Mobilization. The armed forces enjoy greater readiness, but science and the treasury carry the burden. The direction can be reconsidered when the current ten-year plan expires."
 national_direction.2.culture:0 "Our country is experiencing a Cultural Renaissance. Prestige and national cohesion grow, at the cost of construction and military expenditure. The direction can be reconsidered when the current ten-year plan expires."
 national_direction.2.industry:0 "Our country is pursuing Industrial Prosperity. Civilian factories and state revenue benefit, while armaments and political authority receive less attention. The direction can be reconsidered when the current ten-year plan expires."
 national_direction.2.administration:0 "Our country is undertaking Administrative Reform. Bureaucracy and political authority improve, while prestige and public-sector wages impose a cost. The direction can be reconsidered when the current ten-year plan expires."
 national_direction.2.a:0 "Understood."
 trekking_consult_national_direction:0 "Consult the National Direction"
 trekking_consult_national_direction_desc:0 "Review the national priority selected for the current ten-year planning cycle. This decision does not permit an early change of direction."
