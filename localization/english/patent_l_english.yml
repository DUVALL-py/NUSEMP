l_english:
 patent_events.1.t: "Patent [SCOPE.sTechnology('patented_technology').GetName]?"
 patent_events.1.d: "We are currently the only country to possess [SCOPE.sTechnology('patented_technology').GetName]. The government can patent this achievement and publish it to the world. Countries may license part of the research and pay royalties according to the chosen license tier."
 patent_events.1.f: "The value of an invention lies not only in its power to change the world, but also in the right to decide who may use it."
 patent_events.1.a: "Patent and publish the technology."
 patent_events.1.a.tt: "Every country that does not yet possess [SCOPE.sTechnology('patented_technology').GetName] will receive an offer to license it."
 patent_events.1.b: "Knowledge should belong to all humanity."

 patent_events.2.t: "A Patented Technology from [SCOPE.sCountry('patent_holder').GetName]"
 patent_events.2.d: "[SCOPE.sCountry('patent_holder').GetName] has patented [SCOPE.sTechnology('patented_technology').GetName] and is offering research licenses. We may purchase 10%, 20%, or 30% research progress at increasing royalty rates."
 patent_events.2.f: "The drawings, formulae, and prototypes are ready. All that remains is a signature on the license."
 patent_events.2.a: "License and adopt the technology."
 patent_events.2.a.tt: "Immediately gain [SCOPE.sTechnology('patented_technology').GetName] and permanently pay #v 1%#! of our income to [SCOPE.sCountry('patent_holder').GetName]."
 patent_events.2.b: "Refuse. We will not pay royalties."

 patent_royalties: "Patent Royalties"
 patent_royalties_action_name: "Patent Royalties"
 patent_royalties_action_notification_name: "Patent Royalties"
 patent_royalties_action_notification_desc: "A patent royalty agreement has been established."
 patent_royalties_action_propose_name: "Establish Patent Royalties"
 patent_royalties_action_break_name: "End Patent Royalties"
 patent_royalties_action_notification_break_name: "Patent Royalties Ended"
 patent_royalties_action_notification_break_desc: "A patent royalty agreement has ended."
 patent_royalties_desc: "A country using patented technology permanently transfers part of its income to the patent holder."
 patent_royalties_pact_desc: "[SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName] permanently pays #v 1%#! of its income to patent holder [SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName]."

 patent_events.500.t: "Medical Patent Expires"
 patent_events.500.d: "Our five-year medical patent has now expired. The patent provided our treasury with #v +0.2%#! tax income and #v +10%#! innovation for the duration of its term. These royalty revenues are now at an end, but the prestige and knowledge gained from pioneering this innovation remain with us."
 patent_events.500.f: "The ink on the original patent has faded, but the legacy of our discovery endures."
 patent_events.500.a: "The patent has served its purpose."
 patent_events.500.a.tt: "Gain the #bold Patent Legacy#! modifier for #v 2 years#!: #v +10#! Prestige and #v +5%#! Innovation."

 modifier_patent_expired: "Medical Patent Legacy"
 modifier_patent_expired_desc: "This nation pioneered a medical breakthrough that was patented for 5 years, generating #v +0.2%#! tax income and #v +10%#! innovation per week. The patent has since expired, but its legacy of innovation drives continued research."
