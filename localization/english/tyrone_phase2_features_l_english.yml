 building_brewery:0 "Brewery"
 building_brewery_desc:0 "A dedicated facility for brewing beer and ales, from regional craft ales to large-scale industrial lagers."
 building_publishing_house:0 "Publishing House"
 building_publishing_house_desc:0 "A printing and editorial facility that produces newspapers, journals, and books for mass consumption."
 building_perfumery:0 "Perfumery"
 building_perfumery_desc:0 "An artisanal workshop producing fine fragrances, cosmetics, and luxury scented products."
 building_confectionery_factory:0 "Confectionery Factory"
 building_confectionery_factory_desc:0 "A specialized factory producing sweets, chocolates, candies, and pastries for the consumer market."

