 modifier_covered_scandal:0 "Covered Scandal"
 modifier_covered_scandal_desc:0 "Whispers of a covered-up corruption scandal undermine public trust in the government."
 modifier_medical_advancement:0 "Medical Advancement"
 modifier_medical_advancement_desc:0 "Revolutionary medical discoveries have improved public health outcomes."
 modifier_naval_discipline:0 "Naval Discipline Restored"
 modifier_naval_discipline_desc:0 "Harsh punishment of mutineers has reinforced strict discipline across the fleet."
 modifier_naval_reform:0 "Naval Reform"
 modifier_naval_reform_desc:0 "Reforms addressing sailors' grievances have improved morale and reduced maintenance costs."
 modifier_trade_hub_reputation:0 "Trade Hub Reputation"
 modifier_trade_hub_reputation_desc:0 "Our reputation as a reliable trade partner opens new commercial opportunities."
 modifier_aggressive_trade:0 "Aggressive Trade Policy"
 modifier_aggressive_trade_desc:0 "An aggressive push for trade dominance opens markets but strains diplomatic relations."
 modifier_world_exhibition_grand:0 "Grand World Exhibition"
 modifier_world_exhibition_grand_desc:0 "Our magnificent World Exhibition has dazzled the world, drawing innovation, investment, and immigration."
 modifier_world_exhibition_modest:0 "Modest World Exhibition"
 modifier_world_exhibition_modest_desc:0 "Our World Exhibition, while modest, has nonetheless showcased our nation's capabilities."
