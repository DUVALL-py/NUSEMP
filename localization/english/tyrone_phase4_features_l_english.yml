l_english:
 # Olympics
 tyrone_olympics.1.t:0 "Bid for the Olympic Games"
 tyrone_olympics.1.d:0 "The international sporting community proposes a grand athletic competition between nations. Our nation, with its fine stadiums and sporting tradition, could host such an event."
 tyrone_olympics.1.f:0 "Let the games begin!"
 tyrone_olympics.1.a:0 "Begin preparations for the Olympic Games!"
 tyrone_olympics.1.b:0 "We have more pressing concerns."
 tyrone_olympics.2.t:0 "The Olympic Games — Grand Opening!"
 tyrone_olympics.2.d:0 "Athletes from across the globe have gathered in our nation for the grandest sporting spectacle the world has ever seen. Our stadiums overflow with cheering crowds as the opening ceremony dazzles all in attendance."
 tyrone_olympics.2.f:0 "The flame burns bright, uniting nations."
 tyrone_olympics.2.a:0 "A triumph for our nation!"
 modifier_olympic_host:0 "Olympic Host Nation"
 modifier_olympic_host_desc:0 "Hosting the Olympic Games brings unprecedented global prestige, cultural exchange, and migration."

 # Milestones
 tyrone_milestone.1.t:0 "The Iron Horse Arrives!"
 tyrone_milestone.1.d:0 "The first locomotive thunders along gleaming new tracks, heralding a new age of transportation. Crowds gather to witness this marvel of modern engineering."
 tyrone_milestone.1.f:0 "The Age of Steam has begun."
 tyrone_milestone.1.a:0 "The future is on rails!"
 tyrone_milestone.2.t:0 "Industrial Powerhouse"
 tyrone_milestone.2.d:0 "The smoke of a hundred factories rises above our cities. Our nation has transformed into an industrial titan, its forges and mills the envy of the world."
 tyrone_milestone.2.f:0 "The workshop of the world."
 tyrone_milestone.2.a:0 "Industry is our strength!"
 tyrone_milestone.3.t:0 "Mistress of the Seas"
 tyrone_milestone.3.d:0 "Our navy now commands respect across every ocean. With over a hundred warships flying our flag, no rival dares challenge our maritime supremacy."
 tyrone_milestone.3.f:0 "Rule the waves."
 tyrone_milestone.3.a:0 "The seas are ours!"
 tyrone_milestone.4.t:0 "A Modern, Enlightened Nation"
 tyrone_milestone.4.d:0 "With literacy rates surpassing 80%, our nation stands at the forefront of human civilization. Our universities, libraries, and schools are the pride of the educated world."
 tyrone_milestone.4.f:0 "Knowledge is the light of civilization."
 tyrone_milestone.4.a:0 "We are the beacon of progress!"
 tyrone_milestone.5.t:0 "Economic Titan of the World"
 tyrone_milestone.5.d:0 "Our GDP has reached staggering heights. The wealth of our nation surpasses all expectations, making us the undisputed economic titan of the modern age."
 tyrone_milestone.5.f:0 "Gold flows like rivers through our coffers."
 tyrone_milestone.5.a:0 "Prosperity without equal!"
 modifier_railway_pioneer:0 "Railway Pioneer"
 modifier_railway_pioneer_desc:0 "As a pioneer of railway technology, our nation's infrastructure benefits from early adoption."
 modifier_industrial_powerhouse:0 "Industrial Powerhouse"
 modifier_industrial_powerhouse_desc:0 "Our vast industrial base grants efficiency advantages across all manufacturing."
 modifier_naval_supremacy:0 "Naval Supremacy"
 modifier_naval_supremacy_desc:0 "Our dominant navy projects power and prestige across the globe."
 modifier_modern_nation:0 "Modern Enlightened Nation"
 modifier_modern_nation_desc:0 "High literacy and advanced institutions accelerate innovation and national prestige."
 modifier_economic_titan:0 "Economic Titan"
 modifier_economic_titan_desc:0 "Our staggering GDP grants unrivaled trade capacity and global prestige."

 # Propaganda Decrees
 decree_propaganda_pamphlets:0 "Propaganda Pamphlets"
 decree_propaganda_pamphlets_desc:0 "Distribute government-approved pamphlets praising national achievements and rallying popular support."
 decree_state_controlled_press:0 "State-Controlled Press"
 decree_state_controlled_press_desc:0 "Direct newspaper editors to publish pro-government coverage, suppressing dissent through censorship."
 decree_state_radio_broadcast:0 "State Radio Broadcasts"
 decree_state_radio_broadcast_desc:0 "Broadcast government propaganda directly into homes via state-controlled radio stations, shaping public opinion on an unprecedented scale."
