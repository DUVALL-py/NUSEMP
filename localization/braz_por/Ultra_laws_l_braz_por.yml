  ## Distribution of power laws

  law_weighted_universal_suffrage:0 "Sufrágio Universal Ponderado"
  law_weighted_universal_suffrage_desc:0 "Todo homem adulto tem direito a voto. Os homens que possuem terras ou bens de capital recebem mais poder de votos."

  law_weighted_wealth_voting:0 "Votação de Riqueza Ponderada"
  law_weighted_wealth_voting_desc:0 "Os cidadãos ricos têm direito a voto. Os homens que possuem terras ou bens de capital recebem mais poder de votos."

