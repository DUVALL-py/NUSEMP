l_braz_por:
 tyrone_disaster.1.t:0 "Terremoto Devastador!"
 tyrone_disaster.1.d:0 "Um terremoto catastrófico atingiu nossa nação, deixando destruição generalizada. Prédios desabaram, estradas estão intransitáveis e incontáveis cidadãos estão desabrigados."
 tyrone_disaster.1.f:0 "A própria terra treme sob nossos pés."
 tyrone_disaster.1.a:0 "Enviar socorro emergencial imediatamente!"
 tyrone_disaster.1.b:0 "Não podemos intervir."
 tyrone_disaster.2.t:0 "A Grande Enchente"
 tyrone_disaster.2.d:0 "Chuvas sem precedentes fizeram os rios transbordar, inundando terras agrícolas e varrendo casas. A produção agrícola será severamente impactada por anos."
 tyrone_disaster.2.f:0 "As águas sobem sem piedade."
 tyrone_disaster.2.a:0 "Organizar operações de resgate e socorro!"
 tyrone_disaster.2.b:0 "Deixar as águas recuarem naturalmente."
 tyrone_disaster.3.t:0 "Seca Severa Assola a Nação"
 tyrone_disaster.3.d:0 "Meses sem chuva ressecaram a terra. Colheitas murcham nos campos, o gado perece e a fome ameaça a população rural."
 tyrone_disaster.3.f:0 "O sol arde impiedosamente sobre a terra rachada."
 tyrone_disaster.3.a:0 "Financiar irrigação de emergência e distribuição de alimentos!"
 tyrone_disaster.3.b:0 "Rezar por chuva."
 tyrone_disaster.4.t:0 "Erupção Vulcânica!"
 tyrone_disaster.4.d:0 "Uma terrível erupção vulcânica cobriu a região de cinzas e lava. Comunidades inteiras foram evacuadas e a devastação é imensa."
 tyrone_disaster.4.f:0 "Fogo e cinzas escurecem os céus."
 tyrone_disaster.4.a:0 "Evacuar e reconstruir a qualquer custo!"
 tyrone_disaster.4.b:0 "A região está perdida."
 tyrone_disaster.5.t:0 "Reconstrução Nacional Completa"
 tyrone_disaster.5.d:0 "Através de um tremendo esforço nacional, as regiões devastadas foram reconstruídas. Nossa nação emerge do desastre mais forte e resiliente do que antes."
 tyrone_disaster.5.f:0 "Das cinzas, uma nação renascida."
 tyrone_disaster.5.a:0 "Um testamento à resiliência do nosso povo!"
 modifier_earthquake_devastation:0 "Devastação por Terremoto"
 modifier_earthquake_devastation_desc:0 "Danos estruturais generalizados de um terremoto catastrófico prejudicam a construção e infraestrutura."
 modifier_great_flood:0 "Grande Enchente"
 modifier_great_flood_desc:0 "Inundações catastróficas devastaram terras agrícolas e deslocaram populações."
 modifier_severe_drought:0 "Seca Severa"
 modifier_severe_drought_desc:0 "Seca prolongada devasta a agricultura e ameaça fome."
 modifier_volcanic_eruption:0 "Erupção Vulcânica"
 modifier_volcanic_eruption_desc:0 "Cinzas vulcânicas e fluxos de lava destruíram infraestrutura e ceifaram vidas."
 modifier_national_reconstruction:0 "Reconstrução Nacional"
 modifier_national_reconstruction_desc:0 "Uma onda de construção e orgulho nacional após a recuperação bem-sucedida de um desastre."
 modifier_disaster_relief_fund:0 "Fundo de Socorro a Desastres"
 modifier_disaster_relief_fund_desc:0 "Socorro emergencial financiado pelo governo acelera a recuperação e reduz a mortalidade."
