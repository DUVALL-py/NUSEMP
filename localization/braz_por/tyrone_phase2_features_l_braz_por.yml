 modifier_photographic_innovation:0 "Inovação Fotográfica"
 modifier_photographic_innovation_desc:0 "A invenção da fotografia desencadeou uma onda de inovação e documentação cultural."
 modifier_archaeological_prestige:0 "Prestígio Arqueológico"
 modifier_archaeological_prestige_desc:0 "As descobertas arqueológicas de nossa nação trazem prestígio internacional e reconhecimento acadêmico."
 modifier_urban_rebuilding:0 "Reconstrução Urbana"
 modifier_urban_rebuilding_desc:0 "Esforços de reconstrução pós-incêndio modernizaram a infraestrutura urbana."
 modifier_anti_corruption_purge:0 "Expurgo Anticorrupção"
 modifier_anti_corruption_purge_desc:0 "Um expurgo abrangente de funcionários corruptos restaurou a confiança pública, mas reduziu a capacidade administrativa."
 modifier_covered_scandal:0 "Escândalo Encoberto"
 modifier_covered_scandal_desc:0 "Sussurros de um escândalo de corrupção encoberto minam a confiança pública no governo."
 modifier_medical_advancement:0 "Avanço Médico"
 modifier_medical_advancement_desc:0 "Descobertas médicas revolucionárias melhoraram os resultados de saúde pública."
 modifier_naval_discipline:0 "Disciplina Naval Restaurada"
 modifier_naval_discipline_desc:0 "A punição severa dos amotinados reforçou a disciplina estrita em toda a frota."
 modifier_naval_reform:0 "Reforma Naval"
 modifier_naval_reform_desc:0 "Reformas que atendem às reivindicações dos marinheiros melhoraram o moral e reduziram custos de manutenção."
 modifier_trade_hub_reputation:0 "Reputação de Centro Comercial"
 modifier_trade_hub_reputation_desc:0 "Nossa reputação como parceiro comercial confiável abre novas oportunidades comerciais."
 modifier_aggressive_trade:0 "Política Comercial Agressiva"
 modifier_aggressive_trade_desc:0 "Uma pressão agressiva por dominância comercial abre mercados, mas tensiona relações diplomáticas."
 modifier_world_exhibition_grand:0 "Grande Exposição Mundial"
 modifier_world_exhibition_grand_desc:0 "Nossa magnífica Exposição Mundial deslumbrou o mundo, atraindo inovação, investimento e imigração."
 modifier_world_exhibition_modest:0 "Exposição Mundial Modesta"
 modifier_world_exhibition_modest_desc:0 "Nossa Exposição Mundial, embora modesta, mesmo assim demonstrou as capacidades de nossa nação."
