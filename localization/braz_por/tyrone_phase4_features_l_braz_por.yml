l_braz_por:
 # Olimpíadas
 tyrone_olympics.1.t:0 "Candidatura aos Jogos Olímpicos"
 tyrone_olympics.1.d:0 "A comunidade esportiva internacional propõe uma grande competição atlética entre nações. Nossa nação, com seus belos estádios e tradição esportiva, poderia sediar tal evento."
 tyrone_olympics.1.f:0 "Que os jogos comecem!"
 tyrone_olympics.1.a:0 "Iniciar os preparativos para os Jogos Olímpicos!"
 tyrone_olympics.1.b:0 "Temos preocupações mais urgentes."
 tyrone_olympics.2.t:0 "Os Jogos Olímpicos — Grande Abertura!"
 tyrone_olympics.2.d:0 "Atletas de todo o globo se reuniram em nossa nação para o maior espetáculo esportivo que o mundo já viu. Nossos estádios transbordam de multidões vibrantes enquanto a cerimônia de abertura deslumbra a todos."
 tyrone_olympics.2.f:0 "A chama arde brilhante, unindo nações."
 tyrone_olympics.2.a:0 "Um triunfo para nossa nação!"
 modifier_olympic_host:0 "Nação Sede Olímpica"
 modifier_olympic_host_desc:0 "Sediar os Jogos Olímpicos traz prestígio global sem precedentes, intercâmbio cultural e imigração."

 # Marcos Nacionais
 tyrone_milestone.1.t:0 "O Cavalo de Ferro Chegou!"
 tyrone_milestone.1.d:0 "A primeira locomotiva troveja por trilhos novos e reluzentes, anunciando uma nova era de transporte. Multidões se reúnem para testemunhar esta maravilha da engenharia moderna."
 tyrone_milestone.1.f:0 "A Era do Vapor começou."
 tyrone_milestone.1.a:0 "O futuro está nos trilhos!"
 tyrone_milestone.2.t:0 "Potência Industrial"
 tyrone_milestone.2.d:0 "A fumaça de cem fábricas se ergue sobre nossas cidades. Nossa nação se transformou em um titã industrial, suas forjas e usinas são a inveja do mundo."
 tyrone_milestone.2.f:0 "A oficina do mundo."
 tyrone_milestone.2.a:0 "A indústria é nossa força!"
 tyrone_milestone.3.t:0 "Senhora dos Mares"
 tyrone_milestone.3.d:0 "Nossa marinha agora comanda respeito em todos os oceanos. Com mais de cem navios de guerra hasteando nossa bandeira, nenhum rival ousa desafiar nossa supremacia marítima."
 tyrone_milestone.3.f:0 "Domine as ondas."
 tyrone_milestone.3.a:0 "Os mares são nossos!"
 tyrone_milestone.4.t:0 "Uma Nação Moderna e Iluminada"
 tyrone_milestone.4.d:0 "Com taxas de alfabetização superiores a 80%, nossa nação está na vanguarda da civilização humana. Nossas universidades, bibliotecas e escolas são o orgulho do mundo educado."
 tyrone_milestone.4.f:0 "O conhecimento é a luz da civilização."
 tyrone_milestone.4.a:0 "Somos o farol do progresso!"
 tyrone_milestone.5.t:0 "Titã Econômico do Mundo"
 tyrone_milestone.5.d:0 "Nosso PIB atingiu alturas impressionantes. A riqueza de nossa nação supera todas as expectativas, tornando-nos o indiscutível titã econômico da era moderna."
 tyrone_milestone.5.f:0 "Ouro flui como rios por nossos cofres."
 tyrone_milestone.5.a:0 "Prosperidade sem igual!"
 modifier_railway_pioneer:0 "Pioneiro Ferroviário"
 modifier_railway_pioneer_desc:0 "Como pioneiro da tecnologia ferroviária, a infraestrutura de nossa nação se beneficia da adoção precoce."
 modifier_industrial_powerhouse:0 "Potência Industrial"
 modifier_industrial_powerhouse_desc:0 "Nossa vasta base industrial concede vantagens de eficiência em toda a manufatura."
 modifier_naval_supremacy:0 "Supremacia Naval"
 modifier_naval_supremacy_desc:0 "Nossa marinha dominante projeta poder e prestígio pelo mundo."
 modifier_modern_nation:0 "Nação Moderna Iluminada"
 modifier_modern_nation_desc:0 "Alta alfabetização e instituições avançadas aceleram a inovação e o prestígio nacional."
 modifier_economic_titan:0 "Titã Econômico"
 modifier_economic_titan_desc:0 "Nosso PIB impressionante concede capacidade comercial incomparável e prestígio global."

 # Decretos de Propaganda
 decree_propaganda_pamphlets:0 "Panfletos de Propaganda"
 decree_propaganda_pamphlets_desc:0 "Distribuir panfletos aprovados pelo governo exaltando conquistas nacionais e mobilizando apoio popular."
 decree_state_controlled_press:0 "Imprensa Controlada pelo Estado"
 decree_state_controlled_press_desc:0 "Direcionar editores de jornais a publicar cobertura pró-governo, suprimindo a dissidência através da censura."
 decree_state_radio_broadcast:0 "Transmissões de Rádio Estatal"
 decree_state_radio_broadcast_desc:0 "Transmitir propaganda governamental diretamente aos lares via estações de rádio controladas pelo estado, moldando a opinião pública em escala sem precedentes."
