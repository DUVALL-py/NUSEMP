 # ================================================
 tyrone_mechanics.1.t:0 "Surto de Cólera"
 tyrone_mechanics.1.d:0 "Fontes de água contaminadas desencadearam um surto mortal de cólera. O pânico se espalha conforme as baixas aumentam."
 tyrone_mechanics.1.f:0 "As bombas de água da capital cheiram a contágio."
 tyrone_mechanics.1.a:0 "Imponha quarentenas estritas!"
 tyrone_mechanics.1.b:0 "Confie nos médicos locais."

 tyrone_mechanics.2.t:0 "Pânico no Mercado de Ações!"
 tyrone_mechanics.2.d:0 "A febre especulativa se transformou em horror com a queda dos mercados de ações. Casas financeiras enfrentam a ruína enquanto investidores lutam por liquidez."
 tyrone_mechanics.2.f:0 "Pânico no pregão enquanto fortunas evaporam em horas."
 tyrone_mechanics.2.a:0 "Resgate as principais instituições!"
 tyrone_mechanics.2.b:0 "Deixe o mercado expurgar a ineficiência."

 tyrone_mechanics.3.t:0 "Escalação da Corrida Armamentista Naval"
 tyrone_mechanics.3.d:0 "Potências rivais estão expandindo suas frotas de guerra, ameaçando nossa segurança marítima. Estrategistas navais exigem expansão imediata."
 tyrone_mechanics.3.f:0 "Cascos de aço alinham os estaleiros enquanto a guerra se projeta nas sombras."
 tyrone_mechanics.3.a:0 "Construa mais encouraçados!"
 tyrone_mechanics.3.b:0 "Proponha um tratado de desarmamento."

 tyrone_mechanics.4.t:0 "Insurgência Regional"
 tyrone_mechanics.4.d:0 "Populações locais descontentes pegaram em armas em resistência de guerrilha contra a autoridade central."
 tyrone_mechanics.4.f:0 "Tiros ecoam nas colinas enquanto insurgentes atacam guarnições estatais."
 tyrone_mechanics.4.a:0 "Enviar forças de pacificação!"
 tyrone_mechanics.4.b:0 "Ofereça concessões políticas."

