 patent_royalties_20_pact_desc: "[SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName] paga #v 1%#! do rendimento a [SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName]."
