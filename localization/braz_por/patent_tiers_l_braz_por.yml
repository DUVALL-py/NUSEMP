 patent_events.1.t: "Patentear [SCOPE.sTechnology('patented_technology').GetName]?"
 patent_events.1.d: "Somos atualmente o único país com [SCOPE.sTechnology('patented_technology').GetName]. Podemos registar a patente e oferecer licenças de investigação ao resto do mundo."
 patent_events.1.f: "O valor de uma invenção também reside no direito de decidir quem a pode utilizar."
 patent_events.1.a: "Registar e publicar a patente."
 patent_events.1.a.tt: "Os países elegíveis receberão uma proposta de licença."
 patent_events.1.b: "O conhecimento deve pertencer à humanidade."
 patent_events.2.t: "Tecnologia patenteada por [SCOPE.sCountry('patent_holder').GetName]"
 patent_events.2.d: "[SCOPE.sCountry('patent_holder').GetName] oferece-nos progresso de investigação em [SCOPE.sTechnology('patented_technology').GetName] em troca de royalties."
 patent_events.2.f: "Os desenhos, fórmulas e protótipos estão prontos. Falta apenas escolher o contrato."
 patent_events.2.b: "Recusar. Não pagaremos royalties."

 patent_events.500.t: "Patente Médica Expira"
 patent_events.500.d: "A nossa patente médica de cinco anos expirou. Durante a sua vigência, a patente garantiu #v +0,2%#! de rendimento fiscal e #v +10%#! de inovação ao nosso tesouro. Estas receitas de royalties chegaram ao fim, mas o prestígio e o conhecimento adquiridos por sermos pioneiros nesta inovação permanecem connosco."
 patent_events.500.f: "A tinta na patente original desbotou, mas o legado da nossa descoberta perdura."
 patent_events.500.a: "A patente cumpriu o seu propósito."
 patent_events.500.a.tt: "Ganhar o modificador #bold Legado de Patente#! por #v 2 anos#!: #v +10#! Prestígio e #v +5%#! de Inovação."

 modifier_patent_expired: "Legado de Patente Médica"
 modifier_patent_expired_desc: "Esta nação foi pioneira numa descoberta médica patenteada por 5 anos, gerando #v +0,2%#! de rendimento fiscal e #v +10%#! de inovação por semana. A patente expirou, mas o seu legado de inovação impulsiona a investigação contínua."
