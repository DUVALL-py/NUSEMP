 patent_royalties_10_desc: "Concede 10% de progresso em troca de 0,5% do rendimento do licenciado."
 patent_royalties_20_desc: "Concede 20% de progresso em troca de 1% do rendimento do licenciado."
 patent_royalties_30_desc: "Concede 30% de progresso em troca de 2% do rendimento do licenciado."
