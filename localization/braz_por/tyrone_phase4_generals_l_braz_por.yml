 tyrone_generals.2.t:0 "Um Gênio Militar Emerge"
 tyrone_generals.2.d:0 "Uma mente estratégica brilhante ascendeu em nossas fileiras militares. Suas táticas inovadoras e liderança visionária o marcam como um verdadeiro gênio militar de nossa era."
