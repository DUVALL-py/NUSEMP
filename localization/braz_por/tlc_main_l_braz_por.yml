 modifier_tlc_state_capitalism_bonus_desc:0 "O estado dirige o desenvolvimento econômico com planejamento centralizado."
 modifier_tlc_planned_economy_bonus:0 "Economia Centralmente Planificada"
 modifier_tlc_planned_economy_bonus_desc:0 "O estado controla todos os aspectos da produção econômica."
 modifier_tlc_cooperative_economy_bonus:0 "Economia Cooperativa"
 modifier_tlc_cooperative_economy_bonus_desc:0 "Cooperativas de trabalhadores formam a espinha dorsal da economia."
 modifier_tlc_liberal_democracy_bonus:0 "Valores da Democracia Liberal"
 modifier_tlc_liberal_democracy_bonus_desc:0 "Uma sociedade livre e aberta atrai imigrantes e conquista prestígio internacional."
 modifier_tlc_authoritarian_democracy_bonus:0 "Democracia Guiada"
 modifier_tlc_authoritarian_democracy_bonus_desc:0 "Um executivo forte guia o desenvolvimento da nação."
 modifier_tlc_one_party_state_bonus:0 "Domínio de Partido Único"
 modifier_tlc_one_party_state_bonus_desc:0 "O partido dominante mantém controle absoluto sobre a governança."
 modifier_tlc_technocracy_bonus:0 "Governança Tecnocrática"
 modifier_tlc_technocracy_bonus_desc:0 "Especialistas e técnicos guiam a política nacional para máxima eficiência."
 modifier_tlc_military_junta_bonus:0 "Governo Militar"
 modifier_tlc_military_junta_bonus_desc:0 "As forças armadas mantêm a ordem e projetam poder no exterior."
 modifier_tlc_corporate_state_bonus:0 "Governança Corporativa"
 modifier_tlc_corporate_state_bonus_desc:0 "Corporações e industriais efetivamente governam a nação."
 modifier_tlc_workers_commonwealth_bonus:0 "Comunidade dos Trabalhadores"
 modifier_tlc_workers_commonwealth_bonus_desc:0 "Uma sociedade organizada em torno dos direitos dos trabalhadores e propriedade coletiva."
 modifier_tlc_anarchist_federation_bonus:0 "Federação Anarquista"
 modifier_tlc_anarchist_federation_bonus_desc:0 "Uma sociedade descentralizada sem autoridade centralizada."
 
