 law_tlc_no_internment_desc:0 "O estado não opera campos de concentração ou internamento."
 law_tlc_internment_camps:0 "Campos de Concentração"
 law_tlc_internment_camps_desc:0 "O regime opera campos para prisioneiros políticos, indesejáveis e minorias étnicas. Uma instituição horrível."
 
