 modifier_tlc_lgbt_movement_support:0 "Movimento pelos Direitos LGBT Apoiado"
 modifier_tlc_lgbt_movement_support_desc:0 "O apoio do governo ao movimento LGBT criou ondas políticas."
 modifier_tlc_lgbt_movement_suppressed:0 "Movimento pelos Direitos LGBT Suprimido"
 modifier_tlc_lgbt_movement_suppressed_desc:0 "O governo esmagou o nascente movimento pelos direitos LGBT."
 
 # ═══════════════════════════════════════════════════════════════
 # EVENTOS — WORKFORCE
 # ═══════════════════════════════════════════════════════════════
 
 tlc_workforce.1.t:0 "A Força de Trabalho Industrial"
 tlc_workforce.1.d:0 "A urbanização e o crescimento das fábricas estão transformando o mercado de trabalho. Trabalhadores estão deixando o campo em busca de emprego industrial. A força de trabalho disponível está se expandindo."
 tlc_workforce.1.f:0 "As cidades crescem cada vez mais..."
 tlc_workforce.1.a:0 "A era da indústria começou."
 
 tlc_workforce.2.t:0 "A Força de Trabalho Moderna"
 tlc_workforce.2.d:0 "A educação, a urbanização e a mecanização mudaram fundamentalmente a natureza do trabalho. Uma parcela maior da população agora é economicamente ativa."
 tlc_workforce.2.f:0 "Um novo século amanhece..."
 tlc_workforce.2.a:0 "O progresso continua."
 
 tlc_workforce.3.t:0 "A Economia Industrial Tardia"
 tlc_workforce.3.d:0 "A economia moderna exige uma força de trabalho cada vez maior. Nações industrializadas agora podem sustentar operações econômicas maiores sem escassez paralisante de mão de obra."
 tlc_workforce.3.f:0 "As máquinas nunca param..."
 tlc_workforce.3.a:0 "Devemos acompanhar o ritmo."
 
 # ═══════════════════════════════════════════════════════════════
 # EVENTOS — ALEMANHA
 # ═══════════════════════════════════════════════════════════════
 
 tlc_germany.1.t:0 "Unificação Prematura"
 tlc_germany.1.d:0 "A Alemanha foi unificada antes que as fundações políticas e institucionais estivessem verdadeiramente prontas. Embora uma conquista notável, os desafios administrativos de integrar tantos estados diversos serão enormes. Devemos esperar turbulência."
 tlc_germany.1.f:0 "Foi cedo demais?"
 tlc_germany.1.a:0 "Suportaremos as dores do crescimento."
 
 tlc_germany.2.t:0 "Uma Alemanha Unida"
 tlc_germany.2.d:0 "A Alemanha está unida! O longo processo de preparação política e manobras diplomáticas deu frutos. Nossa nação está pronta para seu lugar entre as grandes potências."
 tlc_germany.2.f:0 "Deutschland über alles!"
 tlc_germany.2.a:0 "A nação alemã se ergue!"
 
 tlc_germany.10.a:0 "A recuperação prossegue."
 
 tlc_germany.11.t:0 "Integração Completa"
 tlc_germany.11.d:0 "Os desafios da unificação foram finalmente superados. A Alemanha agora funciona como uma entidade nacional coesa."
 tlc_germany.11.a:0 "Uma nova era começa."
 
 # ═══════════════════════════════════════════════════════════════
 # EVENTOS — ECONOMIA
 # ═══════════════════════════════════════════════════════════════
 
 tlc_economy.1.t:0 "Complexidade Científica Crescente"
 tlc_economy.1.d:0 "À medida que nossa compreensão do mundo se aprofunda, novas descobertas requerem conhecimento e equipamentos cada vez mais especializados. A pesquisa levará mais tempo."
 tlc_economy.1.f:0 "As frutas mais fáceis já foram colhidas."
 tlc_economy.1.a:0 "Devemos investir mais em pesquisa."
 
 tlc_economy.2.t:0 "A Fronteira Científica se Expande"
 tlc_economy.2.d:0 "Os limites do conhecimento humano continuam avançando, mas cada passo adiante exige maior esforço. Novas descobertas requerem instituições dedicadas e especialistas treinados."
 tlc_economy.2.f:0 "Conhecimento sem limite, mas recursos com limite."
 tlc_economy.2.a:0 "A busca pelo conhecimento continua."
 
 tlc_economy.3.t:0 "A Era da Especialização"
 tlc_economy.3.d:0 "A ciência moderna tornou-se altamente especializada. Projetos de pesquisa requerem equipes de especialistas, equipamentos caros e anos de trabalho dedicado."
 tlc_economy.3.f:0 "Acabaram os dias dos gênios solitários."
 tlc_economy.3.a:0 "Nos adaptamos à nova realidade."
 
 tlc_economy.4.t:0 "Pesquisa de Ponta"
 tlc_economy.4.d:0 "Estamos na fronteira do conhecimento humano. Cada nova descoberta exige recursos enormes e as mentes mais brilhantes de uma geração."
 tlc_economy.4.f:0 "O limite do que é possível."
 tlc_economy.4.a:0 "Seguimos em frente independentemente."
 
 # ═══════════════════════════════════════════════════════════════
 # EVENTOS — LGBT
 # ═══════════════════════════════════════════════════════════════
 
 tlc_lgbt.1.t:0 "Movimento pelos Direitos LGBT"
 tlc_lgbt.1.d:0 "Um movimento pelos direitos de homossexuais e minorias de gênero surgiu em nossas cidades. Intelectuais e políticos progressistas estão debatendo se a lei deveria mudar."
 tlc_lgbt.1.f:0 "Uma questão de direitos..."
 tlc_lgbt.1.a:0 "Apoiar o movimento."
 tlc_lgbt.1.b:0 "Manter o status quo."
 
 tlc_lgbt.2.t:0 "Reação Conservadora"
 tlc_lgbt.2.d:0 "A descriminalização da homossexualidade provocou uma reação furiosa de círculos religiosos e conservadores. Eles exigem que as reformas sejam revertidas."
 tlc_lgbt.2.f:0 "Nem todos aceitam a mudança."
 tlc_lgbt.2.a:0 "Mantemos a reforma."
 tlc_lgbt.2.b:0 "Fazer concessões para acalmar a oposição."
 
