 # ═══════════════════════════════════════════════════════════════
 
 modifier_tlc_german_unification_fatigue:0 "Fadiga da Unificação"
 modifier_tlc_german_unification_fatigue_desc:0 "A unificação prematura da Alemanha criou enormes desafios administrativos, turbulência política e problemas de integração."
 modifier_tlc_german_unification_fatigue_reduced:0 "Fadiga da Unificação (Diminuindo)"
 modifier_tlc_german_unification_fatigue_reduced_desc:0 "A turbulência inicial da unificação está diminuindo, mas desafios permanecem."
 modifier_tlc_german_early_unification_penalty:0 "Crise de Unificação Prematura"
 modifier_tlc_german_early_unification_penalty_desc:0 "A Alemanha foi unificada antes que as bases políticas e institucionais estivessem prontas. As consequências são severas."
 
