 modifier_tlc_research_slowdown_era_3:0 "Fronteira Científica Avançada"
 modifier_tlc_research_slowdown_era_3_desc:0 "As fronteiras do conhecimento estão se expandindo, tornando avanços mais difíceis."
 modifier_tlc_research_slowdown_era_4:0 "Pesquisa Científica Complexa"
 modifier_tlc_research_slowdown_era_4_desc:0 "A pesquisa moderna requer investimento e especialização cada vez maiores."
 modifier_tlc_research_slowdown_era_5:0 "Pesquisa de Ponta"
 modifier_tlc_research_slowdown_era_5_desc:0 "Estamos no limite do conhecimento humano. Novas descobertas exigem esforço enorme."
 
