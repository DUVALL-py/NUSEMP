 law_group_tlc_lgbt_rights:0 "Direitos LGBT"
 law_tlc_lgbt_criminalized:0 "Criminalizado"
 law_tlc_lgbt_criminalized_desc:0 "A homossexualidade e a não-conformidade de gênero são crimes previstos em lei."
 law_tlc_lgbt_tolerated:0 "Tolerado"
 law_tlc_lgbt_tolerated_desc:0 "Embora não explicitamente protegida, a homossexualidade não é mais criminalizada."
 law_tlc_lgbt_equal:0 "Direitos Iguais"
 law_tlc_lgbt_equal_desc:0 "Todos os cidadãos gozam de direitos iguais independentemente de orientação sexual ou identidade de gênero."
 
