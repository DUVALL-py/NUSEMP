l_braz_por:
 patent_events.1.t: "Patentear [SCOPE.sTechnology('patented_technology').GetName]?"
 patent_events.1.d: "Atualmente somos o único país a possuir [SCOPE.sTechnology('patented_technology').GetName]. O governo pode patentear esta conquista e publicá-la para o mundo. Outros países poderão licenciar parte da pesquisa e pagar royalties de acordo com o nível de licença escolhido."
 patent_events.1.f: "O valor de uma invenção reside não apenas em seu poder de mudar o mundo, mas também no direito de decidir quem pode utilizá-la."
 patent_events.1.a: "Patentear e publicar a tecnologia."
 patent_events.1.a.tt: "Todo país que ainda não possui [SCOPE.sTechnology('patented_technology').GetName] receberá uma oferta para licenciá-la."
 patent_events.1.b: "O conhecimento deve pertencer a toda a humanidade."

 patent_events.2.t: "Uma Tecnologia Patenteada de [SCOPE.sCountry('patent_holder').GetName]"
 patent_events.2.d: "[SCOPE.sCountry('patent_holder').GetName] patenteou [SCOPE.sTechnology('patented_technology').GetName] e está oferecendo licenças de pesquisa. Podemos adquirir 10%, 20% ou 30% de progresso de pesquisa pagando royalties progressivos."
 patent_events.2.f: "Os diagramas, fórmulas e protótipos estão prontos. Tudo o que resta é a assinatura na licença."
 patent_events.2.a: "Licenciar e adotar a tecnologia."
 patent_events.2.a.tt: "Ganhe imediatamente [SCOPE.sTechnology('patented_technology').GetName] e pague permanentemente #v 1%#! de nossa renda para [SCOPE.sCountry('patent_holder').GetName]."
 patent_events.2.b: "Recusar. Não pagaremos royalties."

 patent_royalties: "Royalties de Patentes"
 patent_royalties_action_name: "Royalties de Patentes"
 patent_royalties_action_notification_name: "Royalties de Patentes"
 patent_royalties_action_notification_desc: "Um acordo de royalties de patentes foi estabelecido."
 patent_royalties_action_propose_name: "Estabelecer Royalties de Patentes"
 patent_royalties_action_break_name: "Encerrar Royalties de Patentes"
 patent_royalties_action_notification_break_name: "Royalties de Patentes Encerrados"
 patent_royalties_action_notification_break_desc: "Um acordo de royalties de patentes foi encerrado."
 patent_royalties_desc: "Um país utilizando tecnologia patenteada transfere permanentemente parte de sua renda para o detentor da patente."
 patent_royalties_pact_desc: "[SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName] paga permanentemente #v 1%#! de sua renda ao detentor da patente [SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName]."
